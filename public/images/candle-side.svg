<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sideBaseShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D251F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FAF6F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sideBasePetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5283D"/>
      <stop offset="50%" stop-color="#991828"/>
      <stop offset="100%" stop-color="#5E0B16"/>
    </linearGradient>
    <linearGradient id="sideMidPetal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#E63950"/>
      <stop offset="60%" stop-color="#AB1E30"/>
      <stop offset="100%" stop-color="#6B0F1A"/>
    </linearGradient>
    <linearGradient id="sideTopPetal" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FA4D64"/>
      <stop offset="50%" stop-color="#BA2236"/>
      <stop offset="100%" stop-color="#7D1321"/>
    </linearGradient>
    <radialGradient id="sideWickGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E0D2C0"/>
      <stop offset="100%" stop-color="#5E5042"/>
    </radialGradient>
    <filter id="sideShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2D251F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Surface Cast Shadow -->
  <ellipse cx="300" cy="460" rx="220" ry="40" fill="url(#sideBaseShadow)"/>

  <!-- Sculpted Rose Candle Body (Side 45-degree angle profile) -->
  <g filter="url(#sideShadow)">
    <!-- Base tier petals (wide spreading outwards) -->
    <path d="M120 420 C90 380 120 340 180 340 C210 340 230 365 250 395 C200 425 150 435 120 420Z" fill="url(#sideBasePetal)"/>
    <path d="M480 420 C510 380 480 340 420 340 C390 340 370 365 350 395 C400 425 450 435 480 420Z" fill="url(#sideBasePetal)"/>
    <path d="M170 435 C240 460 360 460 430 435 C450 405 430 370 370 365 C300 370 230 365 170 435Z" fill="url(#sideBasePetal)"/>

    <!-- Mid tier petals (curving upwards and cupping) -->
    <path d="M150 360 C130 300 180 270 240 280 C270 285 285 320 290 355 C230 365 180 375 150 360Z" fill="url(#sideMidPetal)"/>
    <path d="M450 360 C470 300 420 270 360 280 C330 285 315 320 310 355 C370 365 420 375 450 360Z" fill="url(#sideMidPetal)"/>
    <path d="M220 380 C270 400 330 400 380 380 C400 330 370 295 300 295 C230 295 200 330 220 380Z" fill="url(#sideMidPetal)"/>

    <!-- Inner petal layers (blooming crown) -->
    <path d="M200 290 C190 230 240 200 290 215 C305 240 305 275 300 310 C260 305 220 305 200 290Z" fill="url(#sideTopPetal)"/>
    <path d="M400 290 C410 230 360 200 310 215 C295 240 295 275 300 310 C340 305 380 305 400 290Z" fill="url(#sideTopPetal)"/>
    
    <!-- Rose Central Core / Crown Petals -->
    <path d="M250 250 C245 195 285 175 310 185 C335 175 365 200 355 250 C335 270 270 270 250 250Z" fill="url(#sideTopPetal)"/>
    <path d="M275 225 C270 180 300 165 315 175 C330 165 350 185 340 225 C330 240 290 240 275 225Z" fill="#8A1322"/>
  </g>

  <!-- Cotton Wick on top -->
  <g>
    <path d="M298 178 C302 165 310 158 312 145 C314 135 306 130 300 132" stroke="#1F1A17" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M296 176 C300 163 308 156 310 143 C312 133 304 128 298 130" stroke="url(#sideWickGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="298" cy="130" r="3" fill="#FFFDF8"/>
  </g>
</svg>
